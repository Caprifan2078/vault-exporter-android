name: Hardened source offline and Android compile CI
on:
  push:
    branches: [work/vault-exporter-replayed-20261024]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'integration-jvm/**'
      - 'ci-contract/**'
      - 'RUN_ALL_OFFLINE.sh'
      - 'native-host-test/**'
      - 'transport-jvm/**'
      - '.github/workflows/hardened-source-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Crypto, recovery, bounded heap and media integrity
        run: bash tests/RUN_TESTS_OFFLINE.sh
      - name: Real hardened ExportEngine vs fake TDLib with injected outages
        run: bash integration-jvm/RUN_INTEGRATION_JVM.sh
      - name: Validate current workflow safety contracts
        run: python3 ci-contract/verify_ci_contract.py
      - name: TDLib transport lifecycle and native JNI Unicode
        run: |
          bash transport-jvm/RUN_TRANSPORT_JVM.sh
          bash native-host-test/RUN_NATIVE_HOST_TEST.sh
  android-java:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android compile platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDK_MANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile actual hardened Android Java, without TDLib or an APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -PtelegramEnvironment=test \
            -PtelegramApiId=1 -PtelegramApiHash=00000000000000000000000000000000 \
            :app:compileDebugJavaWithJavac -x :app:verifyExporterBuild
          test -d app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
          test ! -e app/build/outputs/apk/debug/app-debug.apk
          echo 'PASS: hardened source Android Java compilation, no APK or login'
