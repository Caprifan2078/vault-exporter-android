name: Android offline synthetic chat ZIP smoke
on:
  push:
    branches: [work/exporter-apk-build-20261025]
    paths:
      - '.github/workflows/synthetic-offline-smoke.yml'
      - 'ci/synthetic-offline-apk-smoke.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test-on-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VaultExporter-NETWORK-TEST-APK-NOT-PRODUCTION
          run-id: '40237477008'
          repository: adolfmerkel196-ux/vault-exporter-android
          github-token: \${{ github.token }}
          path: ci-apk
      - name: Check compiled APK artifact hash
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/ci-apk/VaultExporter-TEST-DC.apk"
          test -s "$APK"
          (cd ci-apk && sha256sum -c SHA256SUMS.txt)
          echo "APK_UNDER_TEST=$APK" >> "$GITHUB_ENV"
      - name: Android emulator toolchain
        shell: bash
        run: |
          set -euo pipefail
          MGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          yes | "$MGR" --licenses >/dev/null || true
          "$MGR" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Boot emulator and export synthetic chat without network
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash ci/synthetic-offline-apk-smoke.sh
