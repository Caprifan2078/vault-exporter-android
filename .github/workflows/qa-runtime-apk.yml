name: 'QA APK: runtime API credentials, official TDLib, NO account login in CI'
on:
  push:
    branches: [qa/runtime-api-test-account-20261102, qa/full-audit-20261106, qa/recovery-audit-20261109]
    paths:
      - '.github/workflows/qa-runtime-apk.yml'
      - 'app/**'
      - 'tests/RUN_RUNTIME_QA_BUILD_GATES.py'
      - 'ci/synthetic-offline-apk-smoke.sh'
      - 'ci/qa-runtime-native-probe.py'
      - 'ci/qa-keystore-force-stop-probe.py'
      - 'scripts/prepare_tdlib_android.py'
      - 'scripts/verify_tdlib_elf.py'
permissions:
  contents: read
  actions: read
# A TDLib source rebuild is expensive; a newer commit supersedes older QA
# builds on the SAME branch. Never cancel unrelated branches or workflows.
concurrency:
  group: qa-runtime-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Privacy and QA-specific fail-closed checks
        run: |
          set -euo pipefail
          python3 scripts/security_gate.py
          python3 tests/RUN_QA_PRODUCTION_SAFETY_TESTS.py
          python3 tests/RUN_RUNTIME_QA_BUILD_GATES.py
          python3 ci-contract/verify_ci_contract.py
      # The previous run-id 41440702889 artifact expires 2026-11-09.
      # Build from the exact upstream commit rather than from an expiring APK.
      - name: Build pinned official TDLib JSON for ARM64 from source
        shell: bash
        run: |
          set -euo pipefail
          SRC=ea3f69ce11aef458bfbb09869b809ede4447486f
          git clone --filter=blob:none --no-checkout https://github.com/tdlib/td.git official-tdlib-src
          git -C official-tdlib-src checkout --detach "$SRC"
          test "$(git -C official-tdlib-src rev-parse HEAD)" = "$SRC"
          python3 scripts/prepare_tdlib_android.py official-tdlib-src/example/android/Dockerfile
          mkdir -p native-output
          (cd official-tdlib-src/example/android && DOCKER_BUILDKIT=1 docker build \
            --build-arg "COMMIT_HASH=$SRC" \
            --build-arg 'TDLIB_INTERFACE=JSON' \
            --output "type=local,dest=$GITHUB_WORKSPACE/native-output" .)
          ZIP=$(find native-output -type f -name 'tdlib.zip' -print -quit)
          test -n "$ZIP" && test -s "$ZIP"
          mkdir -p native-files
          unzip -q "$ZIP" -d native-files
          SO=$(find native-files -type f -path '*/arm64-v8a/libtdjson.so' -print -quit)
          test -n "$SO" && test -s "$SO"
          python3 scripts/verify_tdlib_elf.py "$SO"
          install -D -m 0644 "$SO" app/src/main/jniLibs/arm64-v8a/libtdjson.so
          python3 scripts/preflight.py
      - name: Install Android SDK/NDK/CMake
        shell: bash
        run: |
          set -euo pipefail
          MGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$MGR"
          yes | "$MGR" --licenses >/dev/null || true
          "$MGR" --sdk_root="$ANDROID_HOME" --install \
            'platforms;android-35' 'build-tools;35.0.0' 'ndk;25.2.9519653' 'cmake;3.22.1'
      - name: Assemble and package network-enabled QA APK (no API keys embedded)
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -PtelegramEnvironment=production \
            -PapproveProductionBuild=true :app:assembleQaRuntime
          APK=app/build/outputs/apk/qaRuntime/app-qaRuntime.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libtdjson.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libvaultbridge.so'
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -F "package: name='org.vault.exporter.runtimeqa'"
          "$AAPT" dump permissions "$APK" | grep -F 'android.permission.INTERNET'
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$SIGNER"
          "$SIGNER" verify --verbose --print-certs "$APK"
          ! "$AAPT" dump permissions "$APK" | grep -E 'READ_CONTACTS|READ_SMS|MANAGE_EXTERNAL_STORAGE'
          BC=app/build/generated/source/buildConfig/qaRuntime/org/vault/exporter/BuildConfig.java
          grep -Eq 'TELEGRAM_TEST_DC = false;' "$BC"
          grep -Eq 'ALLOW_PRODUCTION = true;' "$BC"
          grep -Eq 'QA_PRODUCTION = true;' "$BC"
          grep -Eq 'QA_RUNTIME = true;' "$BC"
          grep -Eq 'TELEGRAM_API_ID = 0;' "$BC"
          grep -Eq 'TELEGRAM_API_HASH = "";' "$BC"
          mkdir -p dist
          cp "$APK" dist/VaultExporter_REAL_TG_RUNTIME_QA_20261102.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          printf '%s\n' \
            'QUARANTINED QA APK: real Telegram network capability, no embedded API credentials.' \
            'Requires owner to enter api_id/hash locally after offline native self-check.' \
            'Do not log in with important accounts. No real account or export tested by CI.' \
            'Not a release. Do not distribute.' > dist/READ_FIRST.txt
      - name: Upload QA-only APK for 1 day
        uses: actions/upload-artifact@v4
        with:
          name: VAULT-REAL-TELEGRAM-RUNTIME-API-QA-UNTESTED
          path: dist/
          retention-days: 1

      # The Android instrumentation lives in a SEPARATE APK, excluded from
      # regular QA, debug and release installations. It uses no real account.
      - name: Build isolated Android Keystore recovery instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          # QA runtime application above already passed verifyExporterBuild.
          # This task builds only the matching signed test-package APK.
          gradle --no-daemon -PtelegramEnvironment=production \
            -PapproveProductionBuild=true :app:assembleQaRuntimeAndroidTest \
            -x :app:verifyExporterBuild
          TEST_APK=$(find app/build/outputs/apk/androidTest -type f -name '*.apk' -print -quit)
          test -n "$TEST_APK" && test -s "$TEST_APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$TEST_APK" | grep -F "package: name='org.vault.exporter.runtimeqa.test'"
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$SIGNER" verify "$TEST_APK"
          mkdir -p keystore-test-dist
          cp "$TEST_APK" keystore-test-dist/VaultExporter-ANDROID-KEYSTORE-TEST.apk
          (cd keystore-test-dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload isolated instrumentation for 1 day
        uses: actions/upload-artifact@v4
        with:
          name: VAULT-ANDROID-KEYSTORE-QA-TEST
          path: keystore-test-dist/
          retention-days: 1

      - name: Build isolated synthetic-export APK without credentials
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -PtelegramEnvironment=test :app:assembleSandboxDc
          APK=app/build/outputs/apk/sandboxDc/app-sandboxDc.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -F "package: name='org.vault.exporter.sandbox.testnet'"
          ! "$AAPT" dump permissions "$APK" | grep -F 'android.permission.INTERNET'
          mkdir -p synthetic-dist
          cp "$APK" synthetic-dist/VaultExporter-OFFLINE-TRAINING.apk
          (cd synthetic-dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload isolated synthetic-export APK
        uses: actions/upload-artifact@v4
        with:
          name: VAULT-OFFLINE-SYNTHETIC-EXPORT
          path: synthetic-dist/
          retention-days: 1

  # Handle system launcher ANR and require each fresh diagnostic success dialog.
  offline-emulator-smoke:
    needs: runtime-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VAULT-REAL-TELEGRAM-RUNTIME-API-QA-UNTESTED
          path: qa-apk
      - name: Verify APK checksum
        run: cd qa-apk && sha256sum -c SHA256SUMS.txt
      - name: Download Keystore crash-recovery instrumentation
        uses: actions/download-artifact@v4
        with:
          name: VAULT-ANDROID-KEYSTORE-QA-TEST
          path: keystore-test-apk
      - name: Validate Keystore test APK checksum
        run: cd keystore-test-apk && sha256sum -c SHA256SUMS.txt
      - name: Enable KVM when available
        run: |
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; else echo 'KVM unavailable'; fi
      - name: Install and launch without network or authentication
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: >-
            adb shell svc wifi disable &&
            adb shell svc data disable &&
            adb install qa-apk/VaultExporter_REAL_TG_RUNTIME_QA_20261102.apk &&
            adb shell am start -W -n org.vault.exporter.runtimeqa/org.vault.exporter.MainActivity &&
            adb shell pidof org.vault.exporter.runtimeqa &&
            adb shell dumpsys activity activities | grep -F 'org.vault.exporter.runtimeqa' &&
            python3 ci/qa-runtime-native-probe.py &&
            adb install -r keystore-test-apk/VaultExporter-ANDROID-KEYSTORE-TEST.apk &&
            python3 ci/qa-keystore-force-stop-probe.py

  offline-synthetic-export:
    needs: runtime-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VAULT-OFFLINE-SYNTHETIC-EXPORT
          path: ci-apk
      - name: Validate offline fixture APK
        run: |
          cd ci-apk
          sha256sum -c SHA256SUMS.txt
          echo "APK_UNDER_TEST=$GITHUB_WORKSPACE/ci-apk/VaultExporter-OFFLINE-TRAINING.apk" >> "$GITHUB_ENV"
      - name: Enable KVM when available
        run: |
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; else echo 'KVM unavailable'; fi
      - name: Export fictional chat without network
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash ci/synthetic-offline-apk-smoke.sh
