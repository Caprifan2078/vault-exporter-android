name: 'QA APK: runtime API credentials, official TDLib, NO account login in CI'
on:
  push:
    branches: [qa/runtime-api-test-account-20261102, qa/full-audit-20261106]
    paths:
      - '.github/workflows/qa-runtime-apk.yml'
      - 'app/**'
      - 'tests/RUN_RUNTIME_QA_BUILD_GATES.py'
permissions:
  contents: read
  actions: read
jobs:
  runtime-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Privacy and QA-specific fail-closed checks
        run: |
          set -euo pipefail
          python3 scripts/security_gate.py
          python3 tests/RUN_QA_PRODUCTION_SAFETY_TESTS.py
          python3 tests/RUN_RUNTIME_QA_BUILD_GATES.py
          python3 ci-contract/verify_ci_contract.py
      - name: Reuse verified official TDLib native binary from successful source build
        uses: actions/download-artifact@v4
        with:
          name: VaultExporter-OFFLINE-SOURCE-REBUILT-APK
          run-id: '41440702889'
          repository: Caprifan2078/vault-exporter-android
          github-token: ${{ github.token }}
          path: verified-offline
      - name: Verify source-built APK checksum, native ABI and manifest
        shell: bash
        run: |
          set -euo pipefail
          (cd verified-offline && sha256sum -c SHA256SUMS.txt)
          ORIGINAL=verified-offline/VaultExporter_QA_OFFLINE_20261102.apk
          test -s "$ORIGINAL"
          unzip -t "$ORIGINAL" | tail -1
          unzip -Z1 "$ORIGINAL" | grep -Fx 'lib/arm64-v8a/libtdjson.so'
          mkdir -p app/src/main/jniLibs/arm64-v8a
          unzip -p "$ORIGINAL" lib/arm64-v8a/libtdjson.so > app/src/main/jniLibs/arm64-v8a/libtdjson.so
          python3 scripts/verify_tdlib_elf.py app/src/main/jniLibs/arm64-v8a/libtdjson.so
          python3 scripts/preflight.py
      - name: Install Android SDK/NDK/CMake
        shell: bash
        run: |
          set -euo pipefail
          MGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$MGR"
          yes | "$MGR" --licenses >/dev/null || true
          "$MGR" --sdk_root="$ANDROID_HOME" --install \
            'platforms;android-35' 'build-tools;35.0.0' 'ndk;25.2.9519653' 'cmake;3.22.1'
      - name: Assemble and package network-enabled QA APK (no API keys embedded)
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -PtelegramEnvironment=production \
            -PapproveProductionBuild=true :app:assembleQaRuntime
          APK=app/build/outputs/apk/qaRuntime/app-qaRuntime.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libtdjson.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libvaultbridge.so'
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -F "package: name='org.vault.exporter.runtimeqa'"
          "$AAPT" dump permissions "$APK" | grep -F 'android.permission.INTERNET'
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$SIGNER"
          "$SIGNER" verify --verbose --print-certs "$APK"
          ! "$AAPT" dump permissions "$APK" | grep -E 'READ_CONTACTS|READ_SMS|MANAGE_EXTERNAL_STORAGE'
          BC=app/build/generated/source/buildConfig/qaRuntime/org/vault/exporter/BuildConfig.java
          grep -Eq 'TELEGRAM_TEST_DC = false;' "$BC"
          grep -Eq 'ALLOW_PRODUCTION = true;' "$BC"
          grep -Eq 'QA_PRODUCTION = true;' "$BC"
          grep -Eq 'QA_RUNTIME = true;' "$BC"
          grep -Eq 'TELEGRAM_API_ID = 0;' "$BC"
          grep -Eq 'TELEGRAM_API_HASH = "";' "$BC"
          mkdir -p dist
          cp "$APK" dist/VaultExporter_REAL_TG_RUNTIME_QA_20261102.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          printf '%s\n' \
            'QUARANTINED QA APK: real Telegram network capability, no embedded API credentials.' \
            'Requires owner to enter api_id/hash locally after offline native self-check.' \
            'Do not log in with important accounts. No real account or export tested by CI.' \
            'Not a release. Do not distribute.' > dist/READ_FIRST.txt
      - name: Upload QA-only APK for 1 day
        uses: actions/upload-artifact@v4
        with:
          name: VAULT-REAL-TELEGRAM-RUNTIME-API-QA-UNTESTED
          path: dist/
          retention-days: 1

  # Wait for the diagnostic control and require each fresh success dialog.
  offline-emulator-smoke:
    needs: runtime-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VAULT-REAL-TELEGRAM-RUNTIME-API-QA-UNTESTED
          path: qa-apk
      - name: Verify APK checksum
        run: cd qa-apk && sha256sum -c SHA256SUMS.txt
      - name: Enable KVM when available
        run: |
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; else echo 'KVM unavailable'; fi
      - name: Install and launch without network or authentication
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: >-
            adb shell svc wifi disable &&
            adb shell svc data disable &&
            adb install qa-apk/VaultExporter_REAL_TG_RUNTIME_QA_20261102.apk &&
            adb shell am start -W -n org.vault.exporter.runtimeqa/org.vault.exporter.MainActivity &&
            adb shell pidof org.vault.exporter.runtimeqa &&
            adb shell dumpsys activity activities | grep -F 'org.vault.exporter.runtimeqa' &&
            python3 ci/qa-runtime-native-probe.py
