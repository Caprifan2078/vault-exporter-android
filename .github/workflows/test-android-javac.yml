name: Compile real Android Java (no Telegram credentials)
on:
  push:
    branches: [work/vault-exporter-integrity-20261024]
    paths:
      - '.github/workflows/test-android-javac.yml'
      - 'exporter-integration/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare pinned real v0.9 Android sources with tested history guard
        shell: bash
        run: |
          set -euo pipefail
          echo '6aa2c1c5805b6044b98a7182b5dcd3cbcd80683429cd1d916779463b047fcef5  Vault-Exporter-Android-v09-source.zip' | sha256sum -c -
          unzip -q Vault-Exporter-Android-v09-source.zip -d "$RUNNER_TEMP/vault"
          SRC="$RUNNER_TEMP/vault/Vault-Exporter-Android-v09"
          python3 exporter-integration/patch_export_engine.py "$SRC/app/src/main/java/org/vault/exporter/ExportEngine.java"
          python3 exporter-integration/guard_chat_identity.py "$SRC/app/src/main/java/org/vault/exporter/ExportEngine.java"
          cp exporter-integration/HistoryCursor.java "$SRC/app/src/main/java/org/vault/exporter/HistoryCursor.java"
          # Pin a v0.9 Gradle Groovy-DSL CMake syntax fix, tested only here.
          python3 - "$SRC/app/build.gradle" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          before="externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' version '3.22.1' } }"
          after="externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }"
          src=p.read_text()
          assert src.count(before)==1, "Unexpected upstream Gradle revision"
          p.write_text(src.replace(before,after))
          PY
          echo "SOURCE=$SRC" >> "$GITHUB_ENV"
      - name: Install Android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDK_MANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile Android Java sources only (NO APK produced)
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE"
          # No real credentials, network login or TDLib needed for Java compilation.
          # Exclude binary preflight only for this compile-only job. Never release an APK.
          gradle --no-daemon -PtelegramEnvironment=test \
            -PtelegramApiId=1 -PtelegramApiHash=00000000000000000000000000000000 \
            :app:compileDebugJavaWithJavac -x :app:verifyExporterBuild
          test -d app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
          test ! -e app/build/outputs/apk/debug/app-debug.apk
          echo 'PASS: Android Java compile only. TDLib/Android runtime NOT validated.'
