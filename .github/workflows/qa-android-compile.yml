name: QA Android Java compile and regression checks (NO Telegram login)
on:
  push:
    branches: [qa/disposable-real-telegram-20261102]
    paths:
      - '.github/workflows/qa-android-compile.yml'
      - 'app/**'
      - 'tests/**'
      - 'scripts/**'
      - 'integration-jvm/**'
      - 'transport-jvm/**'
      - 'native-host-test/**'
      - 'ci-contract/**'
permissions:
  contents: read
jobs:
  static-and-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check build guards and manifest
        run: |
          python3 tests/RUN_QA_PRODUCTION_SAFETY_TESTS.py
          python3 scripts/security_gate.py
          python3 tests/RUN_BUILD_SAFETY_TESTS.py
          python3 tests/RUN_ACTIVITY_SELECTION_SAFETY_TESTS.py
          python3 ci-contract/verify_ci_contract.py
      - name: Fake TDLib export recovery and bounded memory
        run: bash integration-jvm/RUN_INTEGRATION_JVM.sh
      - name: TDLib transport lifecycle
        run: bash transport-jvm/RUN_TRANSPORT_JVM.sh
      - name: JNI bridge against fake TDLib
        run: bash native-host-test/RUN_NATIVE_HOST_TEST.sh
  android-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android platform installed
        shell: bash
        run: |
          set -euo pipefail
          MGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$MGR"
          yes | "$MGR" --licenses >/dev/null || true
          "$MGR" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile Android debug without APK or real credentials
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -PtelegramEnvironment=test \
            -PtelegramApiId=1 \
            -PtelegramApiHash=00000000000000000000000000000000 \
            :app:compileDebugJavaWithJavac -x :app:verifyExporterBuild
          test -d app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
      - name: Compile QA production UI and authorization, no APK or real credentials
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -PtelegramEnvironment=production \
            -PapproveProductionBuild=true -PtelegramApiId=2 \
            -PtelegramApiHash=11111111111111111111111111111111 \
            :app:compileQaProductionJavaWithJavac -x :app:verifyExporterBuild
          test -d app/build/intermediates/javac/qaProduction/compileQaProductionJavaWithJavac/classes
          test ! -e app/build/outputs/apk/qaProduction/app-qaProduction.apk
          echo 'PASS: compile-only. NO installable APK, NO Telegram login.'
