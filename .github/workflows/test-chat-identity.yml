name: Guard chat identity in pinned exporter
on:
  push:
    branches: [work/vault-exporter-integrity-20261024]
    paths:
      - 'exporter-integration/**'
      - '.github/workflows/test-chat-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply pinned cursor patch and identity guards
        shell: bash
        run: |
          set -euo pipefail
          echo '6aa2c1c5805b6044b98a7182b5dcd3cbcd80683429cd1d916779463b047fcef5  Vault-Exporter-Android-v09-source.zip' | sha256sum -c -
          unzip -q Vault-Exporter-Android-v09-source.zip -d "$RUNNER_TEMP/src"
          SRC="$RUNNER_TEMP/src/Vault-Exporter-Android-v09/app/src/main/java/org/vault/exporter/ExportEngine.java"
          python3 exporter-integration/patch_export_engine.py "$SRC"
          python3 exporter-integration/guard_chat_identity.py "$SRC"
          cp exporter-integration/HistoryCursor.java "$(dirname "$SRC")/HistoryCursor.java"
          python3 - "$SRC" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text()
          for marker in ('if (!chat.has("id")','if (!msg.has("chat_id")',
                         'if (!candidate.has("chat_id")'):
              assert s.count(marker)==1, marker
          print('PASS: three identity safeguards in real v0.9 ExportEngine')
          PY

      - name: Compile actual exporter with fake TDLib and exercise three cross-chat failures
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/src/Vault-Exporter-Android-v09/app/src/main/java/org/vault/exporter"
          mkdir -p "$RUNNER_TEMP/fakes/org/vault/exporter" "$RUNNER_TEMP/classes"
          cp exporter-integration/fakes/org/vault/exporter/TdGateway.java "$RUNNER_TEMP/fakes/org/vault/exporter/TdGateway.java"
          python3 exporter-integration/patch_fake_identity.py "$RUNNER_TEMP/fakes/org/vault/exporter/TdGateway.java"
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o "$RUNNER_TEMP/org-json.jar"
          javac -cp "$RUNNER_TEMP/org-json.jar" -d "$RUNNER_TEMP/classes" \
            exporter-integration/fakes/android/content/Context.java \
            exporter-integration/fakes/org/vault/exporter/SessionSecrets.java \
            "$RUNNER_TEMP/fakes/org/vault/exporter/TdGateway.java" \
            "$ROOT"/{ExportEngine,HistoryCursor,ResumeStore,ArchiveWriter,ArchiveVerifier,ChunkedVault,TelegramRateLimit}.java \
            exporter-integration/TestIdentityGuard.java
          java -Xmx256m -cp "$RUNNER_TEMP/classes:$RUNNER_TEMP/org-json.jar" TestIdentityGuard
