name: Inspect actual ExportEngine cursor offline
on:
  push:
    branches: [main]
    paths:
      - 'exporter-integration/**'
      - '.github/workflows/test-exporter-cursor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cursor-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned exporter source and patch only expected cursor
        shell: bash
        run: |
          set -euo pipefail
          echo '6aa2c1c5805b6044b98a7182b5dcd3cbcd80683429cd1d916779463b047fcef5  Vault-Exporter-Android-v09-source.zip' | sha256sum -c -
          unzip -q Vault-Exporter-Android-v09-source.zip -d /tmp/vault-src
          FILE=/tmp/vault-src/Vault-Exporter-Android-v09/app/src/main/java/org/vault/exporter/ExportEngine.java
          python3 exporter-integration/patch_export_engine.py "$FILE"
          cp exporter-integration/HistoryCursor.java /tmp/vault-src/Vault-Exporter-Android-v09/app/src/main/java/org/vault/exporter/HistoryCursor.java
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          content=Path(sys.argv[1]).read_text()
          assert 'long nextFrom=s.cursor;' in content
          assert 'long nextFrom=s.cursor<=1?0:s.cursor-1;' not in content
          assert 'long probe=s.cursor-1;' in content
          assert 'HistoryCursor.select(s.cursor,rawIds)' in content
          assert 'HistoryCursor.select(s.cursor,candidateIds)' in content
          assert 'Конец истории не подтверждён повторным запросом' in content
          print('PASS: actual v0.9 exporter cursor patch applied; NOT a real TDLib execution test')
          PY
      - name: Run 10000-message sparse pagination contract test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cursor-classes
          javac -d /tmp/cursor-classes exporter-integration/HistoryCursor.java exporter-integration/TestHistoryCursor.java
          java -cp /tmp/cursor-classes TestHistoryCursor
      - name: Run actual ExportEngine against offline fake TDLib
        shell: bash
        run: |
          set -euo pipefail
          # Compile the real source, not a reimplementation. Only Context,
          # SessionSecrets, and TdGateway use test-only fakes.
          ROOT=/tmp/vault-src/Vault-Exporter-Android-v09/app/src/main/java/org/vault/exporter
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/org-json.jar
          mkdir -p /tmp/engine-test-classes
          javac -cp /tmp/org-json.jar -d /tmp/engine-test-classes \
            exporter-integration/fakes/android/content/Context.java \
            exporter-integration/fakes/org/vault/exporter/TdGateway.java \
            exporter-integration/fakes/org/vault/exporter/SessionSecrets.java \
            "$ROOT"/ExportEngine.java "$ROOT"/ResumeStore.java \
            "$ROOT"/ArchiveWriter.java "$ROOT"/ArchiveVerifier.java \
            "$ROOT"/ChunkedVault.java "$ROOT"/TelegramRateLimit.java \
            "$ROOT"/HistoryCursor.java \
            exporter-integration/TestRealExportEngine.java
          java -Xmx512m -cp /tmp/engine-test-classes:/tmp/org-json.jar TestRealExportEngine
